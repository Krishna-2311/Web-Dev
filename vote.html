<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Head Boy Election</title>

  <style>
    /* ====== CSS Styles ====== */
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .candidate {
      display: block;
      background: #ecf0f1;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .candidate:hover {
      background: #d0e6f7;
    }

    .candidate input[type="radio"] {
      margin-right: 10px;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      transition: background 0.3s;
    }

    button:hover {
      background: #2980b9;
    }

    .note {
      font-size: 0.8rem;
      color: #888;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>School Head Boy Election 2025</h1>
    <p class="subtitle">Please select your candidate and click Vote.</p>

    <form class="vote-form">
      <label class="candidate">
        <input type="radio" name="candidate" value="Rahul Sharma" required>
        <span>Rahul Sharma</span>
      </label>

      <label class="candidate">
        <input type="radio" name="candidate" value="Arjun Mehta">
        <span>Arjun Mehta</span>
      </label>

      <label class="candidate">
        <input type="radio" name="candidate" value="Ravi Kumar">
        <span>Ravi Kumar</span>
      </label>

      <button type="submit">Vote</button>
    </form>

    <p class="note">*Demo only: Needs backend (PHP, Node.js, etc.) to record votes.</p>
  </div>
</body>
</html>
